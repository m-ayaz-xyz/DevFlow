<main class="min-h-screen bg-white  px-6 py-20">

  <div class="max-w-6xl mx-auto">

    <div class="text-center">
      <span class="text-blue-400 font-bold text-sm uppercase">
        Contact Us
      </span>

      <h1 class="text-4xl md:text-5xl font-bold mt-4">
        Let's Talk
      </h1>

      <p class="mt-4 max-w-xl mx-auto">
        Have a question, suggestion or feedback?
        We'd love to hear from you.
      </p>
    </div>

      <form
        (ngSubmit)="submitForm()"
        #contactForm="ngForm"
        class="bg-white w-full p-7 md:p-9  space-y-5">

        <div>
          <label class="block text-sm font-medium mb-2">Your Name</label>
          <input
            type="text"
            name="name"
            [(ngModel)]="contact.name"
            required
            placeholder="Enter your name"
            class="w-full bg-white border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Email Address</label>
          <input
            type="email"
            name="email"
            [(ngModel)]="contact.email"
            required
            email
            placeholder="you@example.com"
            class="w-full bg-white border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Subject</label>
          <input
            type="text"
            name="subject"
            [(ngModel)]="contact.subject"
            required
            placeholder="How can we help?"
            class="w-full bg-white border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Message</label>
          <textarea
            name="message"
            [(ngModel)]="contact.message"
            required
            rows="5"
            placeholder="Write your message..."
            class="w-full bg-white border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-blue-500 resize-none">
          </textarea>
        </div>

        <button
          type="submit"
          [disabled]="contactForm.invalid"
          class="w-full bg-sky-600 text-white hover:bg-sky-700 disabled:opacity-50 disabled:cursor-not-allowed py-3 rounded-xl font-semibold transition">
          Send Message
        </button>

        <p class="text-xs text-slate-500">
          Your default email application will open to send this message.
        </p>

      </form>
  </div>
</main>
